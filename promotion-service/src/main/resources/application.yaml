spring:
  application:
    name: promotion-service

  datasource:
    url: jdbc:postgresql://localhost:5432/promotion_db
    username: postgres
    password: pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8

server:
  port: 8090

app:
  redis:
    channel:
      promotion-updates: promotion-updates